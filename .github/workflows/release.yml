name: release
# Push a tag v*.*.* to publish. PyPI and npm both use trusted publishing
# (OIDC from this workflow), so no token is stored anywhere.
# npm is a *staged* publish: it waits on npmjs.com until a maintainer approves
# it with their passkey (`npm stage list`, then `npm stage approve <id>`).
on:
  push:
    tags: ["v*.*.*"]
jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - run: pip install build pytest && pytest -q && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
  npm:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest   # staged publishing needs a current npm
      - run: npm test && npm stage publish .
