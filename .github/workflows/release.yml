name: release
# Push a tag v*.*.* to publish. PyPI and npm both use trusted publishing
# (OIDC from this workflow), so no token is stored anywhere.
on:
  push:
    tags: ["v*.*.*"]
jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - run: pip install build pytest && pytest -q && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
  npm:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest   # trusted publishing needs npm 11.5.1+
      - run: npm test && npm publish --access public
